global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: monitoring

# AWS Alloy가 터널 단절 후 WAL(최대 1시간)을 재전송할 때 늦은 샘플을 받는다.
storage:
  tsdb:
    out_of_order_time_window: 1h

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
        labels: {service: school-prometheus, instance: school-prometheus}
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels: {service: school-grafana, instance: school-grafana}
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
        labels: {service: school-tempo, instance: school-tempo}
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels: {service: school-alertmanager, instance: school-alertmanager}
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: {service: school-vm, instance: school-vm}
  # 기존 Loki(설정 변경 없음). 읽기 전용 /metrics, 인증 없는 HTTP 경로라는 기존 한계는 그대로다.
  - job_name: loki
    scrape_interval: 30s
    static_configs:
      - targets: ["ssh.gsmsv.site:26129"]
        labels: {service: loki, instance: existing-loki}
