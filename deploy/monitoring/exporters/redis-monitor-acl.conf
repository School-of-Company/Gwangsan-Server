# Redis ACL 템플릿(gwangsan-monitor). 2026-10-27 redis:7.4-alpine(7.4.12)에서만 검증했다.
# 그 외 버전은 미검증: Redis 6.x에는 LATENCY HISTOGRAM(7.0+)이 없어 해당 토큰에서 오류가 날 수 있다. 운영 버전 확인 후 적용한다.
# 운영 적용은 별도 승인 후 실행하며 비밀번호는 운영 호스트에서 생성한다(저장소 기록 금지).
# 키 읽기/쓰기·채널 권한 없음. redis_exporter가 쓰는 INFO/CONFIG GET/SLOWLOG/LATENCY/CLIENT 등만 허용.
#
# 셸 적용(파이프 해석을 막기 위해 '|'가 든 토큰은 모두 작은따옴표로 감싼다):
#   redis-cli ACL SETUSER gwangsan-monitor reset on '><PASSWORD>' -@all +ping +info '+config|get' '+slowlog|get' '+slowlog|len' '+latency|latest' '+latency|histogram' '+client|list' '+client|info' '+client|setname' +dbsize +select '+memory|stats' '+cluster|info'
# 확인:
#   redis-cli --user gwangsan-monitor --askpass INFO server        (성공해야 함)
#   redis-cli --user gwangsan-monitor --askpass GET any-key        (NOPERM 이어야 함)
# 영속화: ACL 파일/redis.conf 사용 방식을 먼저 확인한 뒤 ACL SAVE 또는 CONFIG REWRITE. 확인 전 실행 금지.
# 되돌리기: redis-cli ACL DELUSER gwangsan-monitor
# Redis 6 미만은 ACL이 없다. requirepass 공유 대신 exporter를 비활성으로 두고 운영 담당자 결정을 받는다.
#
# 아래 줄은 ACL 파일(aclfile) 원문 형식이다. 셸 명령이 아니므로 따옴표 없이 그대로 둔다.
user gwangsan-monitor on ><PASSWORD> resetkeys resetchannels -@all +ping +info +config|get +slowlog|get +slowlog|len +latency|latest +latency|histogram +client|list +client|info +client|setname +dbsize +select +memory|stats +cluster|info
