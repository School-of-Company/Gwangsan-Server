# 준비만 함(미적용): 기존 Loki 2.9.0 앞에 TLS + 경로별 Basic 인증을 두는 역방향 프록시.
# 전제: Loki 호스트 소유자 확인 후 Loki HTTP를 127.0.0.1:3100에만 바인딩하고, 외부 26129는 이 프록시만 연다.
# 인증서·htpasswd는 호스트의 /etc/gwangsan-loki/ 에서 생성한다(저장소에 넣지 않음).
worker_processes 1;
events { worker_connections 256; }

http {
  server_tokens off;
  access_log /dev/stdout;
  client_max_body_size 16m;

  upstream loki { server 127.0.0.1:3100; keepalive 8; }

  server {
    listen 26129 ssl;
    http2 on;
    ssl_certificate     /etc/gwangsan-loki/tls/server.crt;
    ssl_certificate_key /etc/gwangsan-loki/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:loki:1m;

    # Promtail 전송 전용 계정(조회 불가)
    location = /loki/api/v1/push {
      auth_basic "loki-push";
      auth_basic_user_file /etc/gwangsan-loki/htpasswd.push;
      proxy_pass http://loki;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # Grafana 조회 전용 계정(전송 불가)
    location /loki/api/v1/ {
      limit_except GET POST { deny all; }
      auth_basic "loki-query";
      auth_basic_user_file /etc/gwangsan-loki/htpasswd.query;
      proxy_pass http://loki;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 60s;
    }

    # 학교 Prometheus scrape·상태 확인(조회 계정 재사용)
    location ~ ^/(metrics|ready)$ {
      auth_basic "loki-query";
      auth_basic_user_file /etc/gwangsan-loki/htpasswd.query;
      proxy_pass http://loki;
    }

    # 그 외(/config, /flush, /distributor 등 관리 엔드포인트) 차단
    location / { return 404; }
  }
}
