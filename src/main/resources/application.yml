spring:
  application:
    name: gwangsan-api
  main:
    # banner 는 JSON 이 아닌 줄이라 log 수집 파이프라인을 깨뜨린다.
    banner-mode: off
  datasource:
    driver-class-name: ${DB_DRIVER_CLASS:org.mariadb.jdbc.Driver}
    url: jdbc:${RDB_TYPE:mariadb}://${RDB_HOST:localhost}:${RDB_PORT:3306}/${RDB_SCHEMA:gwangsan_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:12345678}
  flyway:
    enabled: false
  jpa:
    hibernate:
      dialect: ${DB_DIALECT:org.hibernate.dialect.MariaDBDialect}
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true


    # stdout 직출력이라 JSON 로그 형식을 벗어난다. SQL 확인이 필요하면 로컬에서만 켠다.
    show-sql: false
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  accessSecret: ${JWT_ACCESS_SECRET:qXWbwKO97FDyg8AdNGh5SakyMHgdEdyfUZi3WPxKZ/c=}
  refreshSecret: ${JWT_REFRESH_SECRET:bddf2bea2033a184add4770ca6fe8957de4e175f2a295658d3dca73a458573c6}

sms:
  apiKey: ${SMS_API_KEY}
  apiSecret: ${SMS_API_SECRET}
  fromnumber: ${SMS_FROM_NUMBER}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_STATIC}
    s3:
      bucket: ${AWS_BUCKET}
    stack:
      auto: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

chat:
  stream:
    group: ${CHAT_STREAM_GROUP:chat-message-persistors}
    batchSize: ${CHAT_STREAM_BATCH_SIZE:10}
    blockMs: ${CHAT_STREAM_BLOCK_MS:500}
    claimIdleMs: ${CHAT_STREAM_CLAIM_IDLE_MS:30000}
    retryMax: ${CHAT_STREAM_RETRY_MAX:5}
    retryKey: ${CHAT_STREAM_RETRY_KEY:chat:retry:messages}
    dlqKey: ${CHAT_STREAM_DLQ_KEY:chat:dlq:messages}

chatting:
  server:
    # Internal API settings for propagating trade status changes to the chatting server.
    url: ${CHATTING_SERVER_URL:}
    internal-secret: ${CHATTING_SERVER_INTERNAL_SECRET:}
    connect-timeout: ${CHATTING_CONNECT_TIMEOUT:2s}
    read-timeout: ${CHATTING_READ_TIMEOUT:5s}

ai:
  server:
    url: ${AI_SERVER_URL:}
    connect-timeout: ${AI_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_READ_TIMEOUT:10s}

logging:
  structured:
    format:
      # timestamp, level, service, message, trace_id, span_id 를 담은 한 줄 JSON
      console: team.startup.gwangsan.infrastructure.logging.GwangsanJsonLogFormatter

# Actuator 는 컨테이너 내부 전용 포트에서만 연다. API 포트(8080)/proxy 로는 노출되지 않는다.
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      # http_server_requests_seconds_bucket 를 계약 bucket 으로만 낸다(기본 percentile histogram 은 bucket 이 너무 많다).
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s,30s,60s

server:
  tomcat:
    # tomcat_threads_*, tomcat_sessions_* metric 을 내려면 필요하다.
    mbeanregistry:
      enabled: true
