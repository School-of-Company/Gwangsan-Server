spring:
  jpa:
    hibernate:
      # create 는 기동 시 drop 후 생성한다. create-drop 의 종료 시 drop 은 Testcontainers DB 가 먼저 내려가면
      # Hikari 연결을 기다리며 JVM shutdown hook 을 붙잡는다(기준선 teardown hang).
      ddl-auto: create
    show-sql: false
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  accessSecret: ${JWT_ACCESS_SECRET:test-secret}
  refreshSecret: test-refresh-secret

sms:
  apiKey: dummy
  apiSecret: dummy
  fromnumber: "01000000000"

cloud:
  aws:
    credentials:
      access-key: dummy
      secret-key: dummy
    region:
      static: ap-northeast-2
    s3:
      bucket: dummy
    stack:
      auto: false

cors:
  allowed-origins: http://localhost:3000

chat:
  stream:
    group: chat-message-persistors
    batchSize: 10
    blockMs: 500
    claimIdleMs: 30000
    retryMax: 5
    retryKey: chat:retry:messages
    dlqKey: chat:dlq:messages

chatting:
  server:
    # Keep empty in tests to disable external chatting server calls by default.
    url: ""
    internal-secret: ""
    connect-timeout: 100ms
    read-timeout: 100ms

ai:
  server:
    url: ""
    connect-timeout: 100ms
    read-timeout: 100ms

management:
  server:
    # 여러 테스트 context 가 동시에 떠도 포트가 겹치지 않게 한다.
    port: 0
