plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'team.startup'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	// agentTest 에서만 -javaagent 로 붙인다. 앱 classpath 에는 들어가지 않는다.
	otelAgent
}

repositories {
	mavenCentral()
}

ext['testcontainers.version'] = '1.21.3'

dependencies {
	// spring-boot-starter
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// querydsl
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.1'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.1:jpa'

	// jakarta
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// docker
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	// DB
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	// aop
	implementation 'org.springframework.boot:spring-boot-starter-aop'

	// test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mariadb'
	testRuntimeOnly 'com.h2database:h2'
	// 헥사고날 계층 경계 검사 (HexagonalArchitectureTest)
	testImplementation 'com.tngtech.archunit:archunit:1.4.2'

	// cloud
	implementation 'software.amazon.awssdk:s3:2.29.49'

	// sms
	implementation("net.nurigo:sdk:4.3.0")


	// gson
	implementation 'com.google.code.gson:gson:2.8.9'

    // retry
    implementation("org.springframework.retry:spring-retry")

	// observability: 런타임 SDK·자동계측은 OpenTelemetry Java agent 가 제공한다. 앱은 API 만 쓴다.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'io.opentelemetry:opentelemetry-api'
	testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
	otelAgent 'io.opentelemetry.javaagent:opentelemetry-javaagent:2.33.1'
}

jacoco {
	toolVersion = "0.8.12"
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'**/GwangsanApplication*',
				// 헥사고날 전환으로 옮긴 기존 제외 대상: global/config·querydsl → infrastructure/config,
				// global/security/config → infrastructure/security/SecurityConfig, global/sms → adapter/sms, entity → *JpaEntity
				'**/infrastructure/config/**',
				'**/infrastructure/security/SecurityConfig*',
				'**/adapter/sms/**',
				'**/*Exception*',
				'**/*Properties*',
				'**/dto/**',
				'**/*JpaEntity*',
				'**/projection/**',
				'**/constant/**',
			])
		}))
	}
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			element = 'CLASS'
			enabled = true
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.60
			}
			limit {
				counter = 'METHOD'
				value = 'COVEREDRATIO'
				minimum = 0.60
			}
		}
	}
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'otel-agent'
	}
	// Docker Engine 29 는 API 1.40 미만을 거부한다. docker-java 가 기본으로 고르는 버전이
	// 그보다 낮아 Testcontainers 가 /info 에서 400 을 받으므로 명시한다.
	environment 'DOCKER_API_VERSION', '1.41'
	environment 'TESTCONTAINERS_API_VERSION', '1.41'
	systemProperty 'api.version', '1.41'
	// 벤치(@Tag("bench")) 반복 횟수. ./gradlew test -Dbench.iterations=30 처럼 넘긴다.
	systemProperty 'bench.iterations', System.getProperty('bench.iterations', '1')
	systemProperty 'bench.preSelect', System.getProperty('bench.preSelect', 'true')
	// 전환 후 테스트 수·Spring context 캐시·ArchUnit import 로 기본 512m 에서 OOM 이 났다(PR12 최종 suite).
	maxHeapSize = '1g'
	finalizedBy jacocoTestReport
}

// 운영과 같은 OpenTelemetry Java agent 를 붙여 @Async·HTTP client context 전파를 확인한다. exporter 는 끈다.
tasks.register('agentTest', Test) {
	description = 'Runs otel-agent tagged tests with the OpenTelemetry Java agent attached.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'otel-agent'
	}
	jvmArgumentProviders.add({ [
			"-javaagent:${configurations.otelAgent.singleFile}",
			'-Dotel.service.name=gwangsan-api-agent-test',
			'-Dotel.traces.exporter=none',
			'-Dotel.metrics.exporter=none',
			'-Dotel.logs.exporter=none',
	] } as CommandLineArgumentProvider)
}
